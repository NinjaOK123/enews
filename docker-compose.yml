version: '3.8'

services:
  # ------ Web Server Nginx (Public Frontend) ------ #
  web:
    image: nginx:alpine
    container_name: enews_web
    restart: unless-stopped
    ports:
      - "8000:80"  # Expose web server on localhost:8000 (hoặc thay đổi cho phù hợp nếu máy đang chạy thứ khác ở port 8000)
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf
    networks:
      - enews_network
    depends_on:
      - app

  # ------ PHP Application + NodeJS (Backend + Build Vite) ------ #
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: enews_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - APACHE_RUN_DIR=/var/run/apache2 # Optional
      # Khai báo môi trường để entrypoint biết
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=enews
      - DB_USERNAME=root
      - DB_PASSWORD=root
    networks:
      - enews_network
    depends_on:
      - db

  # ------ Cơ sở dữ liệu MySQL 8 ------ #
  db:
    image: mysql:8.0
    container_name: enews_db
    restart: unless-stopped
    environment:
      # Sẽ tự động tạo Database trùng tên nếu chưa có
      MYSQL_DATABASE: enews
      MYSQL_ROOT_PASSWORD: root
      # (Tuỳ chọn cấu hình thấp cho RAM nếu máy Share Hosting)
    volumes:
      - enews_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - enews_network

networks:
  enews_network:
    driver: bridge

volumes:
  enews_db_data: # Quản lý dung lượng DB vĩnh viễn không bị xóa khi tắt Container
