server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    # Index ưu tiên file laravel index.php
    index index.php index.html;

    # Cấu hình rewrite mọi request chạy thẳng vào public/index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Cấu hình forward request sang app (PHP-FPM)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Bảo mật: không cho xem file ẩn (giống hệt .htaccess ngoài root)
    location ~ /\. {
        deny all;
    }
}
